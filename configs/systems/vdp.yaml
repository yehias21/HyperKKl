name: vdp
class_name: VdP
init_args:
  zdim: 5
  my: 1.0
  add_noise: true
x_size: 2
y_size: 1
z_size: 5
num_hidden: 2
hidden_size: 350
# Complex-conjugate spectrum, transplanted UNCHANGED from lane -c's duffing.yaml.
# Deliberately identical numbers rather than tuned for vdp: exp11 measured vdp on the real
# diag spectrum at ratio 2.363 against duffing's 0.817, which confounds system with
# spectrum. Reusing the exact M isolates the spectrum as the only varied factor.
M:
  - [-1.5, 3.0, 0, 0, 0]
  - [-3.0, -1.5, 0, 0, 0]
  - [0, 0, -3.5, 7.0, 0]
  - [0, 0, -7.0, -3.5, 0]
  - [0, 0, 0, 0, -5]
K:
  - [1]
  - [1]
  - [1]
  - [1]
  - [1]
limits:
  - [-3, 3]
  - [-3, 3]
time_start: 0
time_end: 50
n_steps: 1000
natural_inputs:
  - zero
  - sinusoid
  - square
  - constant
